.bento{grid-template-areas:none;grid-template-columns:repeat(12,minmax(0,1fr));align-items:stretch}

.bt-hero{order:1}.bt-wk{order:2}.bt-log{order:3}.bt-lgd{order:4}.bt-wat{order:5}.bt-stp{order:6}.bt-slp{order:7}.bt-cre{order:8}

/* ===== Typography: leading + fluid modular scale (clamp) ===== */
:root{--fs-body:clamp(1rem,.95rem + .25vw,1.0625rem);--fs-sm:clamp(.875rem,.84rem + .12vw,.9375rem);--fs-xs:.75rem;
--fs-h1:clamp(2rem,1.6rem + 2vw,2.625rem);--fs-h2:clamp(2rem,1.7rem + 1.5vw,2.375rem);--fs-h3:clamp(1.375rem,1.25rem + .5vw,1.5rem);
--fs-num:clamp(2.25rem,2rem + 1.2vw,2.75rem);--lh-body:1.5;--lh-read:1.6;--lh-head:1.15}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:var(--fs-body);line-height:var(--lh-body)}
p,.note,.how small{line-height:var(--lh-read)}
.mut,.hst,.how small,th,.chip,button.chip,.btn.s,.lgb,.gsz{font-size:var(--fs-sm)}
.mut{line-height:var(--lh-body)}
.f{font-size:var(--fs-xs);line-height:1.4}
.tab{font-size:.9375rem}
input,.ddb,.dpb,.gsz input{font-size:var(--fs-body);line-height:var(--lh-body)}
.dd{font-size:var(--fs-body);font-weight:500;letter-spacing:0;text-transform:none}
.hq .btn{font-size:var(--fs-sm)}
.hb div,.crd div,.mb{font-size:var(--fs-xs)}
h1{font-size:var(--fs-h1);line-height:1.1}
h2{font-size:var(--fs-h2);line-height:1.1}
h3{font-size:var(--fs-h3);line-height:1.2}
.obc h1{font-size:clamp(2.25rem,1.8rem + 2.4vw,3.125rem);line-height:1.1}
.big{font-size:var(--fs-num)}
.pbig{font-size:clamp(3rem,2.4rem + 3vw,4.75rem)}
.tile b{font-size:clamp(1.75rem,1.5rem + 1vw,2.25rem)}
.big,.pbig,.tile b,.stats b,.mac3 b,.how b,.wkn,.dph b,.ring b{line-height:1.1}
h1,h2,h3,.big{text-wrap:balance}p{text-wrap:pretty}
@media(max-width:560px){h1{font-size:var(--fs-h1)}h2{font-size:var(--fs-h2)}}
.btn.ibtn{padding:0;width:32px;min-width:32px;height:32px;font-size:16px;line-height:1}
.wrow .wb{font-size:24px}
.seg .btn{font-size:var(--fs-sm);padding-left:4px;padding-right:4px}

/* ===== v6: soft layered shadows (Z axis) ===== */
:root{--edge:rgb(255 255 255 / .55);
--sh:0 1px 1px rgb(43 44 26 / .04),0 2px 4px rgb(43 44 26 / .04),0 8px 16px rgb(43 44 26 / .06);
--shh:0 2px 2px rgb(43 44 26 / .05),0 4px 8px rgb(43 44 26 / .06),0 16px 32px rgb(43 44 26 / .08);
--shp:0 4px 8px rgb(43 44 26 / .06),0 16px 32px rgb(43 44 26 / .10),0 32px 64px rgb(43 44 26 / .10);
--shv:0 1px 2px rgb(92 26 34 / .20),0 4px 8px rgb(92 26 34 / .12);
--shvh:0 2px 4px rgb(92 26 34 / .22),0 8px 16px rgb(92 26 34 / .16)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge:rgb(255 255 255 / .05);
--sh:0 1px 1px rgb(0 0 0 / .18),0 2px 4px rgb(0 0 0 / .18),0 8px 16px rgb(0 0 0 / .22);
--shh:0 2px 2px rgb(0 0 0 / .22),0 4px 8px rgb(0 0 0 / .24),0 16px 32px rgb(0 0 0 / .30);
--shp:0 4px 8px rgb(0 0 0 / .24),0 16px 32px rgb(0 0 0 / .34),0 32px 64px rgb(0 0 0 / .34);
--shv:0 1px 2px rgb(0 0 0 / .30),0 4px 8px rgb(0 0 0 / .22);--shvh:0 2px 4px rgb(0 0 0 / .32),0 8px 16px rgb(0 0 0 / .28)}}
:root[data-theme="dark"]{--edge:rgb(255 255 255 / .05);
--sh:0 1px 1px rgb(0 0 0 / .18),0 2px 4px rgb(0 0 0 / .18),0 8px 16px rgb(0 0 0 / .22);
--shh:0 2px 2px rgb(0 0 0 / .22),0 4px 8px rgb(0 0 0 / .24),0 16px 32px rgb(0 0 0 / .30);
--shp:0 4px 8px rgb(0 0 0 / .24),0 16px 32px rgb(0 0 0 / .34),0 32px 64px rgb(0 0 0 / .34);
--shv:0 1px 2px rgb(0 0 0 / .30),0 4px 8px rgb(0 0 0 / .22);--shvh:0 2px 4px rgb(0 0 0 / .32),0 8px 16px rgb(0 0 0 / .28)}
.card{box-shadow:inset 0 1px 0 var(--edge),var(--sh)}
.card:hover{transform:none;box-shadow:inset 0 1px 0 var(--edge),var(--sh)}
.tile:hover{transform:none;box-shadow:var(--sh)}.mac3>div:hover{transform:none;box-shadow:none}
nav,.fab,#toast,.rt,.ddl,.dpl,.sov-p,.mdl .card{box-shadow:var(--shp)}
.fab:hover{transform:translateY(-2px);box-shadow:var(--shp)}
.fab.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 20%,transparent),var(--shp)}
.tab.on,.tab.on:hover{box-shadow:var(--shv)}
.dpc.sel{box-shadow:var(--shv)}.hc.l3{box-shadow:none}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shh)}

/* ===== v6: button hierarchy - primary solid wine / secondary olive outline / tertiary text ===== */
.btn,.btn.s,.btn.a{background:transparent;color:var(--olv-t);border:1.5px solid var(--olv-t);box-shadow:none}
.btn:hover{background:color-mix(in srgb,var(--olv-t) 8%,transparent);box-shadow:var(--shh);transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 62%,#000));color:var(--onpri);border-color:transparent;box-shadow:var(--shv)}
.btn.p:hover{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 62%,#000));box-shadow:var(--shvh)}
.btn.t{background:transparent;border-color:transparent;box-shadow:none;padding-left:16px;padding-right:16px}
.btn.t:hover{background:color-mix(in srgb,var(--olv-t) 8%,transparent);box-shadow:none;transform:none}
.seg .btn,.hq .btn{background:transparent}
.seg .btn.on,.btn.on{border-color:transparent}
.hd .btn.s{border-color:transparent}.hd .btn.s.lgb.on{background:var(--pri);color:var(--onpri)}
.wrow .wb{background:transparent}
/* press: inverse scale (declared last so it wins over hover) */
:is(.btn,.tab,.fab,.chip,.opt,.fo,.ddo,.dpc,.dpn,.hc):active{transform:scale(.98)}
.btn:active{box-shadow:none}.btn.p:active{box-shadow:var(--shv)}

/* ===== v6: touch targets >= 44x44 (phones / coarse pointers) ===== */
@media(max-width:640px),(pointer:coarse){
.btn,.btn.s,.tab,.seg .btn,.hq .btn,button.chip,.fo,.ddo,.ftog,.lgb{min-height:44px}
.btn.s,.wkn,.rt .rb{min-width:44px;min-height:44px}
.btn.ibtn,.dpn{width:44px;height:44px;min-width:44px;min-height:44px}
.rt .rb{padding:0 16px}
.dpc{min-height:44px;aspect-ratio:auto}.dpl{width:min(364px,calc(100vw - 32px))}
.cal{gap:2px}.cal .hc{min-height:44px;aspect-ratio:auto;border-radius:8px}
}
@media(max-width:640px),(pointer:coarse){button.chip{min-width:44px}input[style*="padding"]{min-height:44px}.dpg{gap:2px}}

/* ===== v7: focal point - Hero dominates by area + elevation; secondary modules recede ===== */
/* Height is content-driven: no min-height, and the card must not absorb the
   column's spare space (the sibling .bt-pair / .bt-cre do that instead). */
.bt-hero{min-height:0;height:auto;flex:none;align-self:stretch;padding:clamp(20px,1.8vw,28px);gap:clamp(20px,2vw,32px);align-content:center;position:relative;z-index:1;
box-shadow:inset 0 1px 0 rgb(255 255 255 / .12),var(--shp)}
.bt-hero:hover{box-shadow:inset 0 1px 0 rgb(255 255 255 / .12),var(--shp)}
.bt-hero .ring{width:clamp(160px,14vw,208px)}.bt-hero .ring b{font-size:clamp(2.5rem,2.1rem + 1.4vw,3.25rem)}
.bt-hero .stats{gap:12px;margin-bottom:16px}.bt-hero .stats b{font-size:clamp(1.625rem,1.35rem + .9vw,2.125rem)}
.bt-hero .stats>div{padding:8px 12px}
.bt-hero .hmac{gap:12px}.bt-hero .hmac .bar{margin:6px 0 0}
.bt-hero>.split>div>p.mut{margin:8px 0 0!important}
/* the catch-up caption must not widen the auto-sized ring column */
.bt-hero .cap{max-width:24ch;margin-left:auto!important;margin-right:auto!important}
:is(.bt-wat,.bt-stp,.bt-slp,.bt-cre),:is(.bt-wat,.bt-stp,.bt-slp,.bt-cre):hover{box-shadow:inset 0 1px 0 var(--edge),0 1px 2px rgb(43 44 26 / .05)}
:is(.bt-wat,.bt-stp,.bt-slp,.bt-cre) .big{font-size:clamp(1.75rem,1.6rem + .6vw,2.125rem)}
:is(.bt-wat,.bt-stp,.bt-slp,.bt-cre) h3{font-size:clamp(1.125rem,1.05rem + .3vw,1.25rem)}
@media(max-width:640px){.bt-hero{min-height:0}.bt-hero .ring{width:176px}}

/* ===== v7: measure - continuous text capped at ~60 characters per line ===== */
p,.note{max-width:60ch}
p[style*="text-align:center"],[style*="text-align:center"]>p{margin-left:auto!important;margin-right:auto!important}

/* ===== v8: WCAG 2.2 contrast - focus rings (>=3:1) and secondary text (>=4.5:1) ===== */
/* Solid outline instead of a translucent box-shadow: survives .btn{box-shadow:none} and forced-colors mode */
:root{--focus:var(--olv-t);--onpri-mut:hsl(40 42% 86%)}
input:focus,select:focus,textarea:focus,button:focus-visible{box-shadow:none}
:focus-visible,button:focus-visible,.wnt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
/* On olive / wine surfaces the olive ring would vanish (1:1) - switch to cream */
:is(.hero,.phero,.rt,.fo.on) :focus-visible{--focus:var(--onpri)}
/* Muted text on dark surfaces: solid colour instead of opacity */
.hero .mut,.phero span,.pbig small,.fo.on .mut,.rt .rtl span{color:var(--onpri-mut);opacity:1}
/* the goal chip sits on a lightened tint of the hero, so the muted tone only
   reached 4.29:1 there: full cream text on a darker chip instead */
.phero .gt{background:rgba(243,234,217,.10);color:var(--onpri)}
/* Fat macro bar: a light tinted olive via color-mix, not cream at .55 opacity.
   Measured by pixel sampling against the composited track inside the hero. */
.hero .bar.f i{background:color-mix(in srgb,var(--olv-t) 16%,var(--onpri));opacity:1}

/* ===== v9: desaturated semantic states (sage / clay / ochre / slate) =====
   Two tiers on purpose: the pure tone is a SURFACE/HAIRLINE colour (it only reaches
   ~2.1-3.3:1 on cream, so it can never carry text), the -fg tone is the text/icon
   colour (>=4.5:1 on both cream surfaces). */
:root{--ok:#7A8B76;--err:#C27365;--warn:#CBA363;--info:#748796;
--ok-fg:#525E50;--err-fg:#8E4538;--warn-fg:#775828;--info-fg:#4F5D69}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok-fg:#96A493;--err-fg:#CF9186;--warn-fg:#CBA362;--info-fg:#94A2AE}}
:root[data-theme="dark"]{--ok-fg:#96A493;--err-fg:#CF9186;--warn-fg:#CBA362;--info-fg:#94A2AE}
.note.ok{--sx:var(--ok);--sx-fg:var(--ok-fg)}
.note.warn{--sx:var(--warn);--sx-fg:var(--warn-fg)}
.note.err{--sx:var(--err);--sx-fg:var(--err-fg)}
.note.info{--sx:var(--info);--sx-fg:var(--info-fg)}
.note:is(.ok,.warn,.err,.info){background:color-mix(in srgb,var(--sx) 12%,var(--card));border:1px solid color-mix(in srgb,var(--sx) 45%,transparent);border-left:5px solid var(--sx-fg)}
.note:is(.ok,.warn,.err,.info)>b:first-child,.note:is(.ok,.warn,.err,.info)>.sxt{color:var(--sx-fg)}
/* status pills */
.hst.w{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn-fg)}
.hst.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok-fg)}
/* 7-day habit bars: the -fg tier, not the pure tone - a pure-tone fill only reaches
   2.29:1 (sage) / 1.48:1 (ochre) against the empty-bar track and fails 1.4.11 */
.hb i.ok{background:var(--ok-fg)}
.hb i.mid{background:var(--warn-fg)}
/* gym alerts: stalling = warning, recovery issue = danger */
.note.al{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-left:5px solid var(--warn-fg)}
.note.al>b:first-child{color:var(--warn-fg)}
.note.al.high{background:color-mix(in srgb,var(--err) 12%,var(--card));border-color:color-mix(in srgb,var(--err) 45%,transparent);border-left-color:var(--err-fg)}
.note.al.high>b:first-child{color:var(--err-fg)}

/* ===== v10: motion system - inertia curve, calibrated durations, staggered entry ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--t-micro:180ms;--t-press:100ms;--t-data:360ms;--t-panel:300ms;--stagger:60ms}
.btn,.tab,.chip,button.chip,.fo,.ddo,.sw,.ftog,.ddb,.wkn,.opt,.hc,.dpc,.crb,.fab{transition-duration:var(--t-micro);transition-timing-function:var(--ease)}
.card{transition:transform var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
:is(.btn,.tab,.fab,.chip,.opt,.fo,.ddo,.dpc,.dpn,.hc,.sw):active{transition-duration:var(--t-press)}
/* data components: long enough for the eye to register the delta */
.bar i,.pbar i{transition:width var(--t-data) var(--ease)}
.hb i{transition:height var(--t-data) var(--ease)}
.ring circle{transition:stroke-dashoffset 400ms var(--ease)}
.drops i{transition:background var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
/* panels, dropdowns, toasts: same inertia curve */
.ddl,#toast{transition:opacity var(--t-panel) var(--ease),transform var(--t-panel) var(--ease)}
.fw{transition:grid-template-rows var(--t-panel) var(--ease)}
.sov-p{transition:transform var(--t-panel) var(--ease)}
main{animation:in var(--t-panel) var(--ease)}
.card,.tile,.note,.phero,main>h2{animation-timing-function:var(--ease)}
/* staggered entry: --i lives on the card classes (not inline) so the mobile
   reorder below can override it without an !important fight */
.bento :is(.card,.tile,.note){animation-delay:calc(var(--i,0) * var(--stagger))}
.bt-hero{--i:0}.bt-stp{--i:1}.bt-slp{--i:2}.bt-wat{--i:3}.bt-cre{--i:4}.bt-log{--i:5}.bt-lgd{--i:6}
@media(max-width:640px){.bt-hero{--i:0}.bt-log{--i:1}.bt-lgd{--i:2}.bt-wat{--i:4}.bt-stp{--i:5}.bt-slp{--i:6}.bt-cre{--i:7}}

/* ===== v11: progressive disclosure - core KPI on the surface, detail in the panel ===== */
.card>.hdr:first-child{margin-bottom:8px}
.hdr .dtl{color:var(--olv-t);font-size:18px}
.kpi{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kpi .big{flex:none}
body.sov-open{overflow:hidden}
.sov-s{margin-top:24px}
.sov-s:first-child{margin-top:0}
.sov-s>h4{font:600 1.125rem/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 8px;color:var(--olv-t)}
.sov-p .note{margin-bottom:0}
.sov-p .how{margin-bottom:0}
.sov-p:focus-visible{outline:none}
/* the slimmed cards are stretched by the grid: header + KPI stay top, the
   primary action is pinned to the bottom so the breathing room sits in between */
.bt-stp,.bt-slp{display:flex;flex-direction:column}
.bt-stp .hq,.bt-slp .hq{margin-top:auto;margin-bottom:0}
.bt-slp .note{margin-top:16px!important;margin-bottom:0!important}
/* creatine holds only a toggle + streak now: auto margins above and below centre
   the group in the stretched grid cell instead of stranding it at the bottom */
.bt-cre .crb{margin-top:auto!important}
.bt-cre .kpi{margin-top:16px!important;margin-bottom:auto!important}

/* ===== v15: water card is the ring plus one pair of controls, nothing else ===== */
.bt-wat .wrow{gap:32px;margin-top:-4px}

/* ===== v16: language selector follows the gender-toggle pattern =====
   Unselected: baseline capsule border on a recessed surface. Active: solid wine
   with the light on-wine text tone. JS state logic is untouched; this is the
   same .on hook applyLang() already sets. */
.lgb{transition:background-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease)}
/* unselected: transparent with the baseline capsule border, exactly like .seg .btn */
.hd .btn.s.lgb,.obc .lgb{background:transparent;
border:1.5px solid color-mix(in srgb,var(--olv-t) 30%,transparent);color:var(--olv-t)}
.lgb.on,.hd .btn.s.lgb.on,.obc .lgb.on{background:var(--pri);border-color:transparent;color:var(--onpri)}
.thb{background:color-mix(in srgb,var(--bg) 65%,var(--card));border:1.5px solid color-mix(in srgb,var(--olv-t) 30%,transparent)}

/* ===== v17: selected option cards are solid wine, internals inverted ===== */
.opt{transition:background-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease),
border-color var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease),
fill var(--t-micro) var(--ease),stroke var(--t-micro) var(--ease)}
.opt.on{background:var(--pri);border-color:transparent;color:var(--onpri);box-shadow:var(--shv)}
.opt.on b{color:var(--onpri)}
.opt.on span,.opt.on .mut,.opt.on em,.opt.on small{color:var(--onpri-mut)}
.opt.on svg{fill:var(--onpri);stroke:var(--onpri)}
.opt.on .chip{background:rgba(243,234,217,.18);color:var(--onpri)}

/* ===== v18: macro cards share one flex rhythm and one caption treatment ===== */
.mac3>div{display:flex;flex-direction:column;gap:.5rem}
.mac3 span,.mac3 b,.mac3 em{margin:0}
.mac3 span{font-size:var(--fs-sm);line-height:1.3;color:var(--mut)}
.mac3 em{font-family:Montserrat,system-ui,sans-serif;font-size:var(--fs-xs);line-height:1.4;
color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* ===== v19: caption tier + common-region date badge (8pt rhythm) ===== */
.cap{font-size:clamp(.75rem,.72rem + .1vw,.875rem);line-height:1.5;color:var(--mut);margin:8px 0 0;max-width:60ch}

const ge1=q=>{let m=0;q.forEach(s=>{const w=s[0],r=s[1],x=s[2]||0;if(w>0&&r>0)m=Math.max(m,w*(1+(r+x)/30))});return Math.round(m*10)/10};

/* ---- One-rep-max calibration -------------------------------------------
   Estimate a 1RM from an all-out (RIR 0) set the user actually did: any rep
   count they report, e.g. "6 at this weight to failure" or "20 at this one".
   This is a one-off calibration event, deliberately separate from daily
   training, where the KB still keeps heavy compounds at RIR 1-2 (never to
   failure). Returns null on invalid input.
     peso  : kg lifted (>0)
     reps  : reps completed to failure (>=1 integer)
     metodo: 'epley' (default) or 'brzycki'
   Epley is the default because it matches the reference calculator the app is
   modelled on (Strength Level) and stays stable at high reps, where Brzycki
   drifts hard — e.g. 10 kg x 20 gives 16.7 (Epley) vs 21.2 (Brzycki).
   The result carries the 1RM, a flag when reps are high enough that the
   estimate loses precision, and a 100%->50% table in 5% steps. */
function oneRM(peso, reps, metodo){
  peso = +peso; reps = Math.round(+reps);
  if (!(peso > 0) || !(reps >= 1)) return null;
  let rm, warn = '';
  if (reps === 1) { rm = peso; }                                  // 1 rep = 100%, exactly
  else if (metodo === 'brzycki') { rm = peso / (1.0278 - 0.0278 * reps); }
  else { rm = peso * (1 + reps / 30); }                           // Epley (default)
  if (reps > 15) warn = 'high';                                   // estimate loosens in the endurance range
  else if (reps > 12) warn = 'fair';
  rm = Math.round(rm * 10) / 10;
  const table = {};
  for (let p = 100; p >= 50; p -= 5) table[p] = Math.round(rm * p / 100 * 10) / 10;
  return { oneRM: rm, method: metodo === 'brzycki' ? 'brzycki' : 'epley', reps, warn, table };
}
/* Inverse of Epley: the load you could move for n reps given a 1RM, matching
   the formula above. Used for the default working weight — the high end of
   each rep range (8 reps compound, 15 isolation). Rounded to 0.5 kg so it
   lands on real plates. */
const wForReps = (rm, n) => rm ? Math.round(rm / (1 + n / 30) * 2) / 2 : 0;
/* Default working set for an exercise from its 1RM: compounds 6-8 @ the 8-rep
   load, isolation 10-15 @ the 15-rep load (the KB rep bands, high end). */
const workSet = (rm, heavy) => ({ reps: heavy ? 8 : 15, range: heavy ? '6–8' : '10–15', w: wForReps(rm, heavy ? 8 : 15) });
/* Inverse of Epley on reps: how many reps you could do at load w given a 1RM.
   From w = rm/(1+n/30)  ->  n = 30*(rm/w - 1). Rounded to whole reps. */
const repsAtFailure = (rm, w) => (rm && w > 0) ? Math.max(1, Math.round(30 * (rm / w - 1))) : 0;
/* ---- Myo-reps priming set -------------------------------------------------
   The activation set is done to RIR 3. Default aim is 7 reps, so the load is
   the one you would fail at ~10 reps (7 + 3 in reserve) -> ~75% of 1RM. If the
   user changes the load (their gym lacks that exact weight), the app keeps
   RIR 3 by recomputing the rep count: reps = repsAtFailure(load) - 3. The
   user never sets the reps; the system does. */
const MYO_AIM = 7, MYO_RIR = 3;
const myoWeight = rm => wForReps(rm, MYO_AIM + MYO_RIR);     // load for ~10-rep failure -> 7 @ RIR 3
const myoReps = (rm, w) => Math.max(1, repsAtFailure(rm, w) - MYO_RIR);  // reps at this load to sit at RIR 3
/* The myo-reps priming prescription for a lift, from its calibrated 1RM and
   (optionally) a user-chosen load override stored in S.gym.myw. */
function myoSet(n){const c=(S.gym.cal||{})[n];if(!c)return null;const rm=c.rm,
w=(S.gym.myw||{})[n]||myoWeight(rm);return{rm,w,reps:myoReps(rm,w),def:!(S.gym.myw||{})[n]}}
/* Log-panel box for a myo-reps lift: an editable load that live-recomputes the

/* In read-only reopen (ro=true) the myo load shows the SAVED load (first mini-set
   weight) and is disabled; otherwise it shows the prescribed load and is editable. */
const mywV=ro&&savedW!=null?savedW:ms.w;
return`<div class="note info" style="margin:8px 0 0"><b class="sxt">Myo-reps</b>
<div class="row" style="flex-wrap:nowrap;align-items:flex-end;gap:8px;margin-top:4px"><label class="f" style="margin:0;max-width:140px">Load (${u})<input id="myw_${esc(n)}" data-myw="${esc(n)}" type="number" min="0" step="0.5" inputmode="decimal" value="${mywV}"${ro?' disabled':''}></label>
<label class="f" style="margin:0;max-width:120px"><span class="sxt">Priming reps</span><input id="myr_${esc(n)}" data-myr-in="${esc(n)}" type="number" min="0" step="1" inputmode="numeric" placeholder="reps" value="${savedPrimeReps!=null?savedPrimeReps:''}"${ro?' disabled':''}></label>

function gses(){const W=S.gym.wl||{},dle=S.gym.dle||'',o={};Object.keys(W).sort().forEach(k=>{const e=W[k];if(e.dl||e.d<=dle)return;for(const n in e.ex){const v=ge1(e.ex[n]);if(v>0)(o[n]??=[]).push({d:e.d,v,q:e.ex[n],k})}});return o}

/* ---- Weekly sets-per-muscle summary (gymkb § frecuencia/volumen) ----------

   weekly effective-set total + session frequency and decide whether to add or
   cut sets. Colour coding reuses the existing .hst / .hst.ok / .hst.w pills

   10-14 per week) and kept in MBAND so they stay easy to tune:
     large muscles  -> 10-18 weekly is in range (10-14 ideal, up to ~18 ok)
     smaller muscles -> 8-16 weekly is in range

   full-body plan is also flagged amber (low frequency). */
const MBIG=['chest','lats','upper back','quads','hamstrings','glutes'];
const MBAND={big:[10,18],small:[8,16]};

const gfmtSets=n=>{const r=Math.round(n*10)/10;return r%1===0?''+r:r.toFixed(1)};

function gMuscleState(mus,weekly,freq){const[lo,hi]=MBAND[MBIG.includes(mus)?'big':'small'];

return{ok:true,hint:'in range'}}

   sets: they are stored on the exercise object (e.w = how many, 0/undefined =

   they surface in the log screen as labelled, non-RIR-graded lead-in rows. */

dy[2].forEach((e,j)=>{if(!e||e.k!=H)return;const m=muscleOf(gnm(i,j,e)),p=m&&m.p;if(!p)return;

"Golden rules":"Reglas de oro","Strength drives size, so progression matters more than the split. Beyond 2 exercises per muscle in one session is wasted. Sweet spot: 5–7 hard sets per muscle per session, 10–14 per week. Biceps never get more total sets than the back, triceps never more than chest plus shoulders. Add the smallest load possible and aim for 1% better.":"La fuerza impulsa el tamaño, así que la progresión importa más que el split. Más de 2 ejercicios por músculo en una sesión es desperdicio. Punto dulce: 5–7 series duras por músculo por sesión, 10–14 por semana. El bíceps nunca recibe más series totales que la espalda, ni el tríceps más que pecho y hombro juntos. Suma la carga mínima posible y busca mejorar un 1 %.",
"Myo-reps (to save time)":"Myo-reps (para ahorrar tiempo)","One set of 8–12 reps to RIR 1. Rest 5 deep breaths (15–20 s), then 3 reps to failure, repeat. Stop after 5 mini-sets of 3 (raise the load next time) or when a mini-set gives only 2 reps. Use on isolation lifts only.":"Una serie de 8–12 repeticiones hasta RIR 1. Descansa 5 respiraciones profundas (15–20 s), luego 3 repeticiones al fallo y repite. Para tras 5 mini-series de 3 (sube la carga la próxima vez) o cuando una mini-serie dé solo 2 repeticiones. Úsalo solo en ejercicios aislados.",

/* ---- PWA: installable, offline-first ------------------------------------
   Registers the companion service worker (sw.js, which must sit next to this
   file on the server) so the app installs to the home screen and opens with
   no connection. localStorage already holds every byte of user data, so the
   worker only has to cache the shell: this page and the Google font files.
   A service worker must be a real same-origin script, so it cannot be inlined
   here; opening the HTML straight from disk (file://) simply skips it and the
   app keeps working exactly as before. */
(function(){
if(!('serviceWorker'in navigator))return;
if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;
navigator.serviceWorker.register('sw.js').catch(function(){});
})();

   installed or dismissed. */
(function(){

  e.preventDefault();deferred=e;

  var b=document.createElement('button');

});
