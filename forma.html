<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Montserrat,system-ui,sans-serif;transition:background .4s,color .4s}

.wrap{overflow-x:auto}
.hero{background:var(--pri);color:var(--onpri)}.hero .mut{color:inherit;opacity:.78}

.dd{position:relative}

.ddb::after{content:"";position:absolute;right:17px;top:50%;width:7px;height:7px;border:solid var(--pri);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);transition:transform .25s}
.dd.open .ddb{border-color:var(--olv-t)}.dd.open .ddb::after{transform:translateY(-30%) rotate(-135deg)}

.fo{display:flex;justify-content:space-between;gap:8px;width:100%;font:inherit;color:var(--ink);background:none;border:0;border-radius:12px;padding:8px 16px;cursor:pointer;text-align:left;transition:background .15s,padding .2s}
.fo:hover{background:color-mix(in srgb,var(--olv-t) 14%,var(--card));padding-left:16.0px}.fo.on{background:var(--pri);color:var(--onpri)}.fo.on .mut{color:inherit;opacity:.8}
.hd{display:flex;gap:8px;align-items:center}

.scr{max-height:400px;overflow:auto}.mt{font-weight:600;color:var(--olv-t);margin:16px 0 0}
.ftog{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;margin-bottom:8px;position:relative;transition:border .2s,box-shadow .25s}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.yr{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:4px;min-width:560px}.yr .hc{border-radius:3px;font-size:0}
.lg{display:inline-flex;align-items:center;gap:8px;min-width:0;flex:none}.lg .hc{width:14px;height:14px;aspect-ratio:auto;display:inline-block;border-radius:4px}

.tile{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}.tile:hover{transform:translateY(-3px);box-shadow:var(--shh)}
